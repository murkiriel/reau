# What a secret scan will flag in this repository, and why none of it is a secret of this project.
title = "REau"

[extend]
useDefault = true

[[allowlists]]
description = "The public head-unit certificate and key that open Android Auto receivers present in the TLS handshake (see NOTICE)"
paths = ['''app/src/main/res/raw/aa_privkey''']

[[allowlists]]
description = "The sample Sec-WebSocket-Key of RFC 6455, used by the web server's tests"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']   # the RFC's sample nonce itself: the rule tests the secret, not the header's name

[[allowlists]]
description = "The made-up dash Wi-Fi name the log reader's tests use in their sample lines (configKey=\"RE_AB12_345678\"): a sample, not a network"
regexes = ['''RE_AB12_345678''']

[[allowlists]]
description = "The names of the settings' marks that the notification permission was asked (notifications_asked_20261124) and that Ligar opened the app's page (start_app_page_opened_20261124): preference keys, not secrets"
regexes = ['''notifications_asked_20261124|start_app_page_opened_20261124''']

[[allowlists]]
description = "The made-up key alias and passwords that the tests of scripts/release.sh hand to the script, to check that it never prints them: samples, not secrets"
regexes = ['''alias-secreto-xyz|senha-da-loja-123|senha-da-chave-456''']
